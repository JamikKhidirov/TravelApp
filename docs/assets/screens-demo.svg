<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Анимированный макет экранов TravelApp: главный экран, поиск, экран ошибки сети">
  <title>Экраны TravelApp</title>

  <defs>
    <linearGradient id="demoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070E1A"/>
      <stop offset="60%" stop-color="#0D1B31"/>
      <stop offset="100%" stop-color="#132A4C"/>
    </linearGradient>
    <pattern id="demoGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="cardImg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B4C8C"/>
      <stop offset="55%" stop-color="#2D78FF"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="demoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D78FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2D78FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipCard1"><rect x="108" y="224" width="214" height="110" rx="18"/></clipPath>
    <clipPath id="clipScreen1"><rect x="98" y="48" width="234" height="384" rx="24"/></clipPath>
    <clipPath id="clipScreen2"><rect x="483" y="48" width="234" height="384" rx="24"/></clipPath>
    <clipPath id="clipScreen3"><rect x="868" y="48" width="234" height="384" rx="24"/></clipPath>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#demoBg)"/>
  <rect width="1200" height="480" rx="28" fill="url(#demoGrid)"/>
  <circle cx="120" cy="440" r="230" fill="url(#demoGlow)">
    <animate attributeName="cx" values="120;1080;120" dur="28s" repeatCount="indefinite"/>
  </circle>

  <!-- Летящий самолётик на фоне -->
  <g opacity="0.5">
    <path d="M0 0 L26 5 L11 9 L8 20 L3 9 L-11 6 Z" fill="#7FC4FF"/>
    <animateMotion dur="16s" repeatCount="indefinite" rotate="auto" path="M-60 90 C 300 30, 800 150, 1280 60"/>
  </g>
<!-- ============ ТЕЛЕФОН 1: ГЛАВНЫЙ ЭКРАН ============ -->
  <g>
    <rect x="90" y="40" width="250" height="400" rx="32" fill="#0B1421" stroke="#2A3A55" stroke-width="2"/>
    <rect x="98" y="48" width="234" height="384" rx="24" fill="#101B2C"/>
    <rect x="185" y="53" width="60" height="6" rx="3" fill="#22314A"/>
    <g clip-path="url(#clipScreen1)">
      <rect x="108" y="72" width="214" height="34" rx="17" fill="#16243A" stroke="#FF8C00" stroke-opacity="0.5"/>
      <circle cx="128" cy="89" r="6" fill="none" stroke="#FF8C00" stroke-width="2"/>
      <path d="M132 93 L137 98" stroke="#FF8C00" stroke-width="2" stroke-linecap="round"/>
      <rect x="146" y="85" width="96" height="8" rx="4" fill="#2C3E5C"/>
      <text x="108" y="133" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#6C8099">Ближащие</text>
      <text x="184" y="133" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFB347">Популярные</text>
      <rect y="141" width="66" height="3" rx="1.5" fill="#FF8C00">
        <animate attributeName="x" values="184;184;110;110;184" keyTimes="0;0.35;0.45;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <circle cx="132" cy="180" r="21" fill="url(#cardImg)"/>
      <circle cx="190" cy="180" r="21" fill="#1B4C8C"/>
      <circle cx="248" cy="180" r="21" fill="#FF8C00" opacity="0.85"/>
      <rect x="114" y="206" width="36" height="7" rx="3.5" fill="#2C3E5C"/>
      <rect x="172" y="206" width="36" height="7" rx="3.5" fill="#2C3E5C"/>
      <rect x="230" y="206" width="36" height="7" rx="3.5" fill="#2C3E5C"/>
      <rect x="108" y="224" width="214" height="110" rx="18" fill="url(#cardImg)"/>
      <rect x="108" y="224" width="214" height="110" rx="18" fill="#000000" fill-opacity="0.25"/>
      <rect x="118" y="240" width="120" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.75"/>
      <rect x="118" y="258" width="80" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.45"/>
      <circle cx="126" cy="288" r="9" fill="#FFFFFF" fill-opacity="0.75"/>
      <rect x="142" y="284" width="62" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5"/>
      <rect x="118" y="308" width="70" height="20" rx="10" fill="#FF8C00"/>
      <text x="153" y="322" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#101B2C" text-anchor="middle">1 500 &#8381;</text>
      <g clip-path="url(#clipCard1)">
        <rect x="108" y="224" width="70" height="110" fill="url(#shine)">
          <animateTransform attributeName="transform" type="translate" values="-70 0;220 0" dur="2.8s" repeatCount="indefinite"/>
        </rect>
      </g>
      <rect x="108" y="372" width="214" height="44" rx="22" fill="#16243A" stroke="#2A3A55"/>
      <rect y="376" width="52" height="36" rx="18" fill="#2D78FF" fill-opacity="0.35">
        <animate attributeName="x" values="112;165;218;165;112" keyTimes="0;0.25;0.5;0.75;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <path d="M135 398 L140 391 L145 398 Z" fill="#E3ECF8"/>
      <rect x="136" y="398" width="8" height="7" rx="1" fill="#E3ECF8"/>
      <circle cx="191" cy="396" r="5" fill="none" stroke="#8FA8C8" stroke-width="2"/>
      <path d="M195 400 L200 405" stroke="#8FA8C8" stroke-width="2" stroke-linecap="round"/>
      <path d="M244 401 L238 395 C236 393 238 390 240 391 L244 395 L248 391 C250 390 252 393 250 395 Z" fill="#8FA8C8"/>
      <circle cx="297" cy="394" r="5" fill="#8FA8C8"/>
      <path d="M289 406 C291 400 303 400 305 406 Z" fill="#8FA8C8"/>
    </g>
  </g>
<!-- ============ ТЕЛЕФОН 2: ПОИСК ============ -->
  <g>
    <rect x="475" y="40" width="250" height="400" rx="32" fill="#0B1421" stroke="#2A3A55" stroke-width="2"/>
    <rect x="483" y="48" width="234" height="384" rx="24" fill="#101B2C"/>
    <rect x="570" y="53" width="60" height="6" rx="3" fill="#22314A"/>
    <g clip-path="url(#clipScreen2)">
      <rect x="493" y="72" width="214" height="38" rx="19" fill="#16243A" stroke="#2D78FF" stroke-opacity="0.75"/>
      <circle cx="514" cy="91" r="6" fill="none" stroke="#2D78FF" stroke-width="2"/>
      <path d="M518 95 L523 100" stroke="#2D78FF" stroke-width="2" stroke-linecap="round"/>
      <rect x="531" y="87" width="70" height="8" rx="4" fill="#2C3E5C"/>
      <rect x="606" y="82" width="2.5" height="18" fill="#2D78FF">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="493" y="141" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#E3ECF8">Популярные места</text>
      <g>
        <rect x="493" y="154" width="214" height="34" rx="12" fill="#16243A"/>
        <circle cx="516" cy="171" r="10" fill="#1B4C8C"/>
        <rect x="535" y="164" width="90" height="8" rx="4" fill="#2C3E5C"/>
        <rect x="535" y="177" width="58" height="6" rx="3" fill="#24344C"/>
        <rect x="493" y="154" width="64" height="34" fill="url(#shine)">
          <animateTransform attributeName="transform" type="translate" values="-64 0;214 0" dur="2.6s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g>
        <rect x="493" y="196" width="214" height="34" rx="12" fill="#16243A"/>
        <circle cx="516" cy="213" r="10" fill="#FF8C00" opacity="0.8"/>
        <rect x="535" y="206" width="104" height="8" rx="4" fill="#2C3E5C"/>
        <rect x="535" y="219" width="48" height="6" rx="3" fill="#24344C"/>
        <rect x="493" y="196" width="64" height="34" fill="url(#shine)">
          <animateTransform attributeName="transform" type="translate" values="-64 0;214 0" dur="2.6s" begin="0.45s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g>
        <rect x="493" y="238" width="214" height="34" rx="12" fill="#16243A"/>
        <circle cx="516" cy="255" r="10" fill="#2D78FF" opacity="0.8"/>
        <rect x="535" y="248" width="78" height="8" rx="4" fill="#2C3E5C"/>
        <rect x="535" y="261" width="66" height="6" rx="3" fill="#24344C"/>
        <rect x="493" y="238" width="64" height="34" fill="url(#shine)">
          <animateTransform attributeName="transform" type="translate" values="-64 0;214 0" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g>
        <rect x="493" y="280" width="214" height="34" rx="12" fill="#16243A"/>
        <circle cx="516" cy="297" r="10" fill="#3DDC84" opacity="0.8"/>
        <rect x="535" y="290" width="96" height="8" rx="4" fill="#2C3E5C"/>
        <rect x="535" y="303" width="52" height="6" rx="3" fill="#24344C"/>
        <rect x="493" y="280" width="64" height="34" fill="url(#shine)">
          <animateTransform attributeName="transform" type="translate" values="-64 0;214 0" dur="2.6s" begin="1.35s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="600" y="400" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" fill="#5C7A9C" text-anchor="middle">история поиска и подсказки</text>
    </g>
  </g>
<!-- ============ ТЕЛЕФОН 3: ЭКРАН ОШИБКИ СЕТИ ============ -->
  <g>
    <rect x="860" y="40" width="250" height="400" rx="32" fill="#0B1421" stroke="#2A3A55" stroke-width="2"/>
    <rect x="868" y="48" width="234" height="384" rx="24" fill="#101B2C"/>
    <rect x="955" y="53" width="60" height="6" rx="3" fill="#22314A"/>
    <g clip-path="url(#clipScreen3)">
      <g stroke="#FF6B6B" stroke-width="5" fill="none" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
        <path d="M945 128 C 963 106, 1010 106, 1028 128"/>
        <path d="M960 146 C 973 133, 1000 133, 1013 146"/>
        <circle cx="986" cy="166" r="6" fill="#FF6B6B" stroke="none"/>
        <line x1="946" y1="108" x2="1026" y2="176" stroke-width="4"/>
      </g>
      <text x="985" y="216" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#E3ECF8" text-anchor="middle">Что-то пошло не так</text>
      <text x="985" y="239" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11" fill="#8FA8C8" text-anchor="middle">Проверьте подключение к интернету</text>
      <rect x="920" y="262" width="132" height="34" rx="17" fill="#FF8C00">
        <animate attributeName="opacity" values="1;0.75;1" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="986" y="284" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#101B2C" text-anchor="middle">Повторить попытку</text>
      <rect x="920" y="330" width="132" height="8" rx="4" fill="#22314A"/>
      <rect x="940" y="352" width="92" height="8" rx="4" fill="#1B2840"/>
      <rect x="960" y="374" width="52" height="8" rx="4" fill="#1B2840"/>
    </g>
  </g>

  <!-- Подписи экранов -->
  <g font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" fill="#8FA8C8" text-anchor="middle">
    <text x="215" y="462">Главный экран: поиск, табы, города, туры</text>
    <text x="600" y="462">Поиск: история и популярные места</text>
    <text x="985" y="462">Состояние сети: ошибка и retry</text>
  </g>
</svg>
