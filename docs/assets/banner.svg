<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="TravelApp - Android приложение для поиска туров">
  <title>TravelApp</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B16"/>
      <stop offset="45%" stop-color="#102A52"/>
      <stop offset="100%" stop-color="#1B4C8C"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="50%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFD79A"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8C00" stop-opacity="0"/>
      <stop offset="55%" stop-color="#FFB347" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7FC4FF" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8C00" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D78FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2D78FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="360" fill="url(#sky)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Живые световые пятна -->
  <circle cx="-100" cy="120" r="220" fill="url(#glow)">
    <animate attributeName="cx" values="-100;1300;-100" dur="26s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="300" r="240" fill="url(#glowBlue)">
    <animate attributeName="cx" values="1100;200;1100" dur="32s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="40" r="180" fill="url(#glow)" opacity="0.6">
    <animate attributeName="r" values="160;220;160" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Мерцающие звёзды -->
  <g fill="#FFFFFF">
    <circle cx="90" cy="60" r="2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="110" r="1.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="45" r="2.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.7s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="95" r="1.5"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="55" r="2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="120" r="1.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="70" r="2.1"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="130" r="1.6"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.8s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="45" r="2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Дрейфующие облака -->
  <g fill="#FFFFFF" opacity="0.10" filter="url(#soft)">
    <g>
      <ellipse cx="140" cy="300" rx="90" ry="26"/>
      <ellipse cx="210" cy="290" rx="60" ry="20"/>
      <animateTransform attributeName="transform" type="translate" values="-300 0;1500 0" dur="48s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="900" cy="250" rx="120" ry="30"/>
      <ellipse cx="990" cy="240" rx="70" ry="22"/>
      <animateTransform attributeName="transform" type="translate" values="1520 0;-320 0" dur="62s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.7">
      <ellipse cx="560" cy="120" rx="70" ry="18"/>
      <animateTransform attributeName="transform" type="translate" values="-260 0;1540 0" dur="56s" begin="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Пунктирный трейс полёта -->
  <path id="flightPath" d="M-80 250 C 280 150, 620 250, 1280 80" fill="none" stroke="url(#trailGrad)" stroke-width="2" stroke-dasharray="10 12" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-220" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <!-- Самолёт -->
  <g>
    <path d="M0 0 L34 6 L14 12 L10 26 L4 12 L-14 8 Z" fill="#FFFFFF"/>
    <path d="M0 0 L34 6 L14 12 L10 26 L4 12 L-14 8 Z" fill="#FFD79A" opacity="0.5"/>
    <animateMotion dur="12s" repeatCount="indefinite" rotate="auto">
      <mpath href="#flightPath"/>
    </animateMotion>
  </g>

  <!-- Заголовок -->
  <g text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="600" y="172" font-size="86" font-weight="700" letter-spacing="3" fill="#FF8C00" opacity="0.55" filter="url(#soft)">TravelApp<animate attributeName="opacity" values="0.25;0.7;0.25" dur="6s" repeatCount="indefinite"/></text>
    <text x="600" y="172" font-size="86" font-weight="700" letter-spacing="3" fill="url(#titleGrad)">TravelApp<animate attributeName="y" values="172;168;172" dur="7s" repeatCount="indefinite"/></text>
    <text x="600" y="216" font-size="21" fill="#C9D6E8">Многомодульное Android-приложение для поиска туров, городов и мест</text>
    <text x="600" y="248" font-size="15" fill="#8FA8C8" letter-spacing="1.5">KOTLIN 2.1 · JETPACK COMPOSE · HILT · RETROFIT 3 · ROOM · FIREBASE</text>
  </g>

  <!-- Плашки, появляющиеся по очереди -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <g opacity="0">
      <rect x="360" y="276" width="118" height="34" rx="17" fill="#FF8C00" fill-opacity="0.18" stroke="#FF8C00" stroke-opacity="0.65"/>
      <text x="419" y="298" fill="#FFB347">Compose UI</text>
      <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.2s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="490" y="276" width="104" height="34" rx="17" fill="#2D78FF" fill-opacity="0.18" stroke="#2D78FF" stroke-opacity="0.65"/>
      <text x="542" y="298" fill="#8FC0FF">Clean Arch</text>
      <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.5s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="606" y="276" width="112" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.35"/>
      <text x="662" y="298" fill="#E3ECF8">36 модулей</text>
      <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.8s" fill="freeze"/>
    </g>
    <g opacity="0">
      <rect x="730" y="276" width="112" height="34" rx="17" fill="#3DDC84" fill-opacity="0.15" stroke="#3DDC84" stroke-opacity="0.6"/>
      <text x="786" y="298" fill="#9FE9BE">CI / CD</text>
      <animate attributeName="opacity" values="0;1" dur="1.2s" begin="1.1s" fill="freeze"/>
    </g>
  </g>
</svg>
