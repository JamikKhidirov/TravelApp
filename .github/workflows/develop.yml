name: Android CI/CD Pipeline - Develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even without changes'
        type: boolean
        default: false

env:
  VERSION_NAME: "2.0.${{ github.run_number }}-dev"
  VERSION_CODE: "${{ github.run_number }}"
  GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintRelease --continue

      # Новый шаг: тесты с детальным логом ошибок
      - name: Run Unit Tests with detailed logs
        id: test_step
        continue-on-error: true  # Продолжаем даже при ошибке, чтобы собрать логи
        run: |
          # Запускаем тесты и сохраняем вывод
          ./gradlew testRelease --continue --stacktrace 2>&1 | tee test_output.log
          
          # Проверяем, есть ли ошибки
          if grep -q "BUILD FAILED" test_output.log; then
            echo "❌ Тесты упали!"
            echo "error_detected=true" >> $GITHUB_OUTPUT
          
            # Сохраняем ошибку в файл
            grep -A 50 "FAILURE:" test_output.log > error_details.txt
            grep -A 30 "What went wrong:" test_output.log >> error_details.txt
            grep -A 30 "Compilation error" test_output.log >> error_details.txt
          
            # Сохраняем полный лог как артефакт
            mkdir -p error_logs
            cp test_output.log error_logs/
            cp error_details.txt error_logs/
          
            # Находим конкретную ошибку компиляции
            echo "=== Детали ошибки компиляции ===" >> error_logs/compilation_errors.txt
            grep -B 5 -A 10 "error:" test_output.log >> error_logs/compilation_errors.txt
            grep -B 5 -A 10 "unresolved reference" test_output.log >> error_logs/compilation_errors.txt
            grep -B 5 -A 10 "Type mismatch" test_output.log >> error_logs/compilation_errors.txt
          else
            echo "✅ Тесты прошли успешно!"
            echo "error_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-develop
          path: |
            **/build/reports/
            **/build/test-results/
            test_output.log
            error_logs/
          retention-days: 14

      - name: Upload Error Logs
        if: steps.test_step.outputs.error_detected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: error-logs-develop
          path: |
            error_logs/
            **/build/reports/
            **/build/test-results/
            test_output.log
          retention-days: 30

  build:
    needs: test
    if: always() && needs.test.result != 'failure'  # Только если тесты прошли
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [TravelApp, TravelAdmin]
    steps:
    # ... остальные шаги как раньше ...

  # ============================================================
  # ДЕТАЛЬНОЕ УВЕДОМЛЕНИЕ ОБ ОШИБКЕ
  # ============================================================
  notify_failure:
    needs: [test, build]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Download error logs
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: error-logs/
          pattern: error-logs-develop
          merge-multiple: true

      - name: Get error details
        id: error_details
        run: |
          # Проверяем, есть ли файлы с ошибками
          if [ -f error-logs/compilation_errors.txt ]; then
            echo "📄 Найдены ошибки компиляции"
            ERROR_TEXT=$(cat error-logs/compilation_errors.txt | head -100)
          elif [ -f error-logs/error_details.txt ]; then
            echo "📄 Найдены детали ошибки"
            ERROR_TEXT=$(cat error-logs/error_details.txt | head -100)
          elif [ -f error-logs/test_output.log ]; then
            echo "📄 Найден лог тестов"
            ERROR_TEXT=$(cat error-logs/test_output.log | grep -A 20 "FAILURE:" | head -100)
          else
            echo "❌ Не найдены логи ошибок"
            ERROR_TEXT="Нет подробных логов. Проверьте артефакты в GitHub Actions."
          fi

          # Формируем сообщение
          cat << EOF > error_message.txt
          ❌ **BUILD FAILED - Детальная ошибка**

          📱 **Проект:** TravelApp (Develop)

          📌 **Версия:** ${{ env.VERSION_NAME }}
          🌿 **Ветка:** `develop`
          👤 **Автор:** ${{ github.actor }}
          🔗 **Коммит:** ${{ github.sha }}

          📝 **Сообщение коммита:**
          ${{ github.event.head_commit.message }}

          🔍 **Тип ошибки:** Компиляция Kotlin тестов

          📊 **Статус:**
          - Тесты: ❌ ПРОВАЛЕНЫ
          - Сборка: ❌ НЕ ЗАПУЩЕНА

          🔧 **Детали ошибки:**
          \`\`\`
          $ERROR_TEXT
          \`\`\`

          🛠 **Как исправить:**
          1. Проверьте файлы в `applications/TravelAdmin/feature/notification/src/test/`
          2. Исправьте синтаксические ошибки в коде
          3. Проверьте импорты и зависимости
          4. Запустите локально: `./gradlew testRelease`

          🔗 **Ссылка на логи:**
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ⏱ **Время:** `${{ github.run_started_at }}`
          EOF

          echo "message=$(cat error_message.txt)" >> $GITHUB_OUTPUT

      - name: Send detailed error to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID_DEV }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: ${{ steps.error_details.outputs.message }}

      - name: Send error logs as file
        if: always()
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID_DEV }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: error-logs/error_details.txt