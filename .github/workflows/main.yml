name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  VERSION_NAME: "1.0.${{ github.run_number }}"
  VERSION_CODE: "${{ github.run_number }}"
  GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        continue-on-error: true
        run: ./gradlew test --continue

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Позволяет читать историю коммитов

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract Commit Information
        run: |
          mkdir -p meta
          echo "COMMIT_TITLE=$(git log -1 --format='%s')" >> meta/commit_info.txt
          echo "COMMIT_BODY<<EOF" >> meta/commit_info.txt
          git log -1 --format='%b' >> meta/commit_info.txt
          echo "EOF" >> meta/commit_info.txt

      - name: Build Release APKs
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName="${{ env.VERSION_NAME }}"

      - name: Prepare APK Artifacts
        run: |
          mkdir -p apks_to_send
          cp applications/TravelApp/build/outputs/apk/release/*.apk apks_to_send/TravelApp_v${{ env.VERSION_NAME }}.apk || true
          cp applications/TravelAdmin/build/outputs/apk/release/*.apk apks_to_send/TravelAdmin_v${{ env.VERSION_NAME }}.apk || true

      - name: Upload APKs & Meta Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-data
          path: |
            apks_to_send/
            meta/
          retention-days: 1

  send:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build-data

      - name: Load Commit Info to Environment
        run: |
          cat meta/commit_info.txt >> $GITHUB_ENV

      - name: Send TravelApp to Telegram
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            📱 **TravelApp (Release)**
            
            📌 **Версия:** `${{ env.VERSION_NAME }}` (Сборка #${{ env.VERSION_CODE }})
            👤 **Автор:** `${{ github.actor }}`
            
            📝 **Коммит:**
            _${{ env.COMMIT_TITLE }}_
            
            📄 **Описание:**
            ${{ env.COMMIT_BODY }}
          document: apks_to_send/TravelApp_v${{ env.VERSION_NAME }}.apk

      - name: Send TravelAdmin to Telegram
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🛠 **TravelAdmin (Release)**
            
            📌 **Версия:** `${{ env.VERSION_NAME }}` (Сборка #${{ env.VERSION_CODE }})
            👤 **Автор:** `${{ github.actor }}`
            
            📝 **Коммит:**
            _${{ env.COMMIT_TITLE }}_
            
            📄 **Описание:**
            ${{ env.COMMIT_BODY }}
          document: apks_to_send/TravelAdmin_v${{ env.VERSION_NAME }}.apk