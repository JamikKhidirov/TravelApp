name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. Запуск тестов для обоих модулей
      - name: Run Unit Tests
        run: ./gradlew test

      # 2. Сборка APK с динамическим versionName и versionCode
      - name: Build APKs
        run: |
          ./gradlew assembleDebug \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}"

      # 3. Переименование APK для удобства
      - name: Prepare APK Artifacts
        run: |
          VERSION="1.0.${{ github.run_number }}"
          mkdir -p apks_to_send
          
          # Копируем и переименовываем TravelApp
          cp applications/TravelApp/build/outputs/apk/debug/applications-TravelApp-debug.apk apks_to_send/TravelApp_v${VERSION}.apk || \
          find applications/TravelApp/build/outputs/apk/ -name "*.apk" -exec cp {} apks_to_send/TravelApp_v${VERSION}.apk \;

          # Копируем и переименовываем TravelAdmin
          cp applications/TravelAdmin/build/outputs/apk/debug/applications-TravelAdmin-debug.apk apks_to_send/TravelAdmin_v${VERSION}.apk || \
          find applications/TravelAdmin/build/outputs/apk/ -name "*.apk" -exec cp {} apks_to_send/TravelAdmin_v${VERSION}.apk \;

      # 4. Отправка TravelApp в Telegram
      - name: Send TravelApp to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: "📱 **TravelApp** (Клиент)\nВерсия: `1.0.${{ github.run_number }}`\nСборка #${{ github.run_number }} успешно завершена!"
          document: apks_to_send/TravelApp_v1.0.${{ github.run_number }}.apk

      # 5. Отправка TravelAdmin в Telegram
      - name: Send TravelAdmin to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: "🛠 **TravelAdmin** (Админка)\nВерсия: `1.0.${{ github.run_number }}`\nСборка #${{ github.run_number }} успешно завершена!"
          document: apks_to_send/TravelAdmin_v1.0.${{ github.run_number }}.apk
